<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | VOTION</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main class="container">
      <section class="form-shell">
        <div class="eyebrow">WE ARE HERE TO HELP</div>
        <h1>Contact VOTION</h1>
        <form class="form" id="contactForm">
          <input name="name" placeholder="Name" required />
          <input name="email" type="email" placeholder="Email" required />
          <input name="phone" placeholder="Phone" />
          <textarea name="message" placeholder="Message" required></textarea>
          <button class="btn" type="submit">Submit</button>
        </form>
        <p id="contactStatus" style="color: var(--muted)">
          Send us a message and our concierge team will respond shortly.
        </p>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script>
      const form = document.getElementById("contactForm");
      const status = document.getElementById("contactStatus");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());

        status.textContent = "Sending your enquiry...";
        status.style.color = "var(--muted)";

        try {
          const response = await fetch(
            `${window.VOTION_API.replace(/\/api$/, "")}/api/contact`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Unable to send your enquiry.");
          }

          status.textContent =
            result.message || "Your enquiry has been received.";
          status.style.color = "#1d8f5f";
          form.reset();
        } catch (error) {
          status.textContent = error.message;
          status.style.color = "#d94d4d";
        }
      });
    </script>
  </body>
</html>
