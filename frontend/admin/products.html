<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Products | VOTION</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <main class="container">
      <section>
        <div class="section-head">
          <h1>Products</h1>
          <a class="btn" href="dashboard.html">Dashboard</a>
        </div>
        <div class="products" id="products">
          <div class="empty">Loading...</div>
        </div>
      </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/admin.js"></script>
    <script>
      const token = localStorage.votionAdmin || "";
      const headers = { Authorization: `Bearer ${token}` };
      fetch(`${VOTION_API}/products/admin`, { headers })
        .then((response) => {
          if (!response.ok) throw new Error("Admin session expired");
          return response.json();
        })
        .then((items) => {
          products.innerHTML = items.length
            ? items
                .map(
                  (p) =>
                    `<article class="card"><img src="${p.images?.[0] || "../favicon.svg"}" alt="${p.name}"><div class="card-info"><small>${p.category} · ${p.isActive ? "Published" : "Unpublished"}</small><h3>${p.name}</h3><p>₹${p.discountPrice || p.price} · <span class="stock-label">${p.stock ? `In stock (${p.stock})` : "Out of stock"}</span></p><div class="stock-controls"><button type="button" onclick="adjustStock('${p._id}', ${p.stock - 1})">−</button><span>${p.stock}</span><button type="button" onclick="adjustStock('${p._id}', ${p.stock + 1})">+</button></div><div class="admin-actions"><a class="btn" href="edit-product.html?id=${p._id}">Edit</a><button class="btn danger" type="button" onclick="deleteProduct('${p._id}')">Delete</button></div></div></article>`,
                )
                .join("")
            : '<div class="empty">No products found.</div>';
        })
        .catch((error) => {
          products.innerHTML = `<div class="empty">${error.message}</div>`;
        });
      async function deleteProduct(id) {
        if (!confirm("Delete this product?")) return;
        const response = await fetch(`${VOTION_API}/products/${id}`, {
          method: "DELETE",
          headers,
        });
        if (response.ok) location.reload();
        else
          alert((await response.json()).message || "Unable to delete product");
      }
      async function adjustStock(id, stock) {
        if (stock < 0) return;
        const response = await fetch(`${VOTION_API}/products/${id}/stock`, {
          method: "PATCH",
          headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify({ stock }),
        });
        if (response.ok) location.reload();
        else alert((await response.json()).message || "Unable to update stock");
      }
    </script>
  </body>
</html>
